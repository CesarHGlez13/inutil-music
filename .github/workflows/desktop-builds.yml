name: Release installers

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-installers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Alineado con el toolchain que generó `pubspec.lock` (Flutter 3.50.0 /
  # Dart 3.14 medido con `flutter --version`). Con 3.47.9 el job quality
  # reventaba en `flutter pub get --enforce-lockfile` porque ese SDK quiere
  # `test_api 0.7.12` y el lock trae `0.7.14`: “Unable to satisfy
  # pubspec.yaml using pubspec.lock … Would change 1 dependency”, medido en
  # https://github.com/CesarHGlez13/inutil-music/actions/runs/44853194063
  FLUTTER_VERSION: "3.50.0"
  # Endpoints horneados dentro de TODOS los binarios. Medido el 2026-11-20:
  # los assets publicados de v2.5.12 y v2.5.13 eran byte-idénticos a un build
  # SIN estos defines (`unzip -p <apk> lib/arm64-v8a/libapp.so | strings -a`
  # devolvía 0 ocurrencias de `workers.dev` y 0 de `192.168.100.27`, y el
  # `sha256 42a81121…` coincidía con el build local), o sea el relay del
  # servidor de casa y el Worker cloud nunca funcionaron en la app instalada.
  # Cada `flutter build` los recibe como `--dart-define` y los jobs de
  # Android, Windows, Linux y macOS repiten la misma medición sobre su propio
  # artefacto, así un build sin endpoints no puede salir a publicarse.
  FB_RELAY_HOST: "192.168.100.27"
  FB_CLOUD_RELAY_HOST: "inutil-cloud-relay.scada-xiaomi-server.workers.dev"

jobs:
  quality:
    # Stable candidate for the required status check on protected branches.
    name: Required quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        # 9.5.0 es el `distributionUrl` de
        # `android/gradle/wrapper/gradle-wrapper.properties`; el paso
        # `Assert Gradle matches the Android wrapper` abajo falla si los dos
        # se separan. Se instala explícitamente porque `android/.gitignore:4`
        # ignora `/gradlew`, así que en CI no existe un `./gradlew` hasta que
        # Flutter lo inyecta: `gradle_utils.dart:229-246` (`getExecutable` →
        # `injectGradleWrapperIfNeeded`) lo crea sólo cuando corres
        # `flutter build apk`, y `flutter test` no lo crea. Medido: con
        # `gradle-version: "8.14.3"` (runs 44879291272 y 44891202761) el paso
        # de pruebas unitarias reventaba — primero
        # "Minimum supported Gradle version is 9.3.1. Current version is
        # 8.14.3" (exigencia de AGP `com.android.application` 9.1.1,
        # `android/settings.gradle.kts:23`) y luego `./gradlew: No such file or
        # directory` exit 127.
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
        with:
          gradle-version: "9.5.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Patch pub-cache plugins for AGP 9
        shell: bash
        # AGP 9.1.1 (`android/settings.gradle.kts:23`) rechaza
        # `getDefaultProguardFile('proguard-android.txt')` (el archivo incluye
        # `-dontoptimize`), y `flutter_inappwebview_android-1.1.3` lo usa en las
        # líneas 44 y 48 de su `android/build.gradle`. Medido en el run
        # 44895843926 (11:00:43Z): `A problem occurred evaluating project
        # ':flutter_inappwebview_android'` / `Build file '...build.gradle'
        # line: 44` / `BUILD FAILED in 2m 42s`; reproducido en local con el
        # archivo pristino de pub.dev → `BUILD FAILED in 20s`, y con el
        # parche → `BUILD SUCCESSFUL` con las 26 pruebas en verde. El script es
        # idempotente (2a corrida: `0 archivo(s) parcheados, 0 restantes`) y
        # sale en error si queda algún `.txt`, así que CI y las máquinas
        # locales convergen al mismo estado del pub cache.
        run: bash tool/patch_pub_cache_proguard.sh

      - name: Configure Android Gradle properties
        shell: bash
        run: |
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - name: Verify formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test integration_test test_driver tool

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Smoke-test LIVE overlay layouts
        run: node tool/live_overlay_browser_smoke.mjs

      - name: Assert Gradle matches the Android wrapper
        shell: bash
        run: |
          set -euo pipefail
          want="$(sed -nE 's/^distributionUrl=.*gradle-([0-9.]+)-(bin|all)\.zip$/\1/p' \
            android/gradle/wrapper/gradle-wrapper.properties)"
          have="$(gradle --version | sed -nE 's/^Gradle ([0-9.]+)$/\1/p' | head -1)"
          if [ -z "$want" ] || [ -z "$have" ]; then
            echo "no se pudieron leer las versiones (want=$want have=$have)" >&2
            exit 1
          fi
          if [ "$have" != "$want" ]; then
            echo "Gradle en PATH es $have pero el wrapper clava $want" >&2
            exit 1
          fi
          # AGP 9.1.1 (`android/settings.gradle.kts:23`) exige >= 9.3.1.
          awk -v v="$have" 'BEGIN { split(v, p, "."); n = p[1]*10000 + p[2]*100 + p[3]; exit (n < 90301 ? 1 : 0) }'
          echo "Gradle $have: coincide con el wrapper y satisface AGP 9.1.1"

      - name: Run Android unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd android
          gradle --version
          gradle :app:testDebugUnitTest :just_audio:testDebugUnitTest --no-daemon

      - name: Enforce self-contained media resolver
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eiq '^[[:space:]]*youtube_explode(_dart)?[[:space:]]*:' pubspec.yaml pubspec.lock; then
            echo "youtube_explode must not be present in the dependency graph." >&2
            exit 1
          fi

          legacy_tools="$(
            find android windows/tools linux/tools macos/tools \
              -type f \
              \( \
                -iname 'yt-dlp*' -o \
                -iname 'yt_dlp*' -o \
                -iname 'ytdlp*' -o \
                -iname 'deno' -o \
                -iname 'deno.exe' \
              \) \
              -print 2>/dev/null || true
          )"
          if [[ -n "$legacy_tools" ]]; then
            echo "External resolver executables must not be vendored:" >&2
            printf '%s\n' "$legacy_tools" >&2
            exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14
          archive: false

  ios:
    name: iOS unsigned IPA
    needs: [metadata, quality]
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ needs.metadata.outputs.app_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze source on macOS
        run: flutter analyze

      - name: Run iOS support tests
        run: >-
          flutter test
          test/ios_support_contract_test.dart
          test/platform_channels/ios_file_export_channel_test.dart
          test/platform_channels/ios_local_media_channel_test.dart
          test/services/local_media/ios_device_audio_catalog_test.dart
          test/services/media_session/desktop_media_session_factory_test.dart
          --reporter compact

      - name: Build unsigned iOS simulator app
        run: >-
          flutter build ios --simulator --no-codesign
          --dart-define=FB_RELAY_HOST=${ env.FB_RELAY_HOST }
          --dart-define=FB_CLOUD_RELAY_HOST=${ env.FB_CLOUD_RELAY_HOST }

      - name: Build unsigned iOS device app
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=FB_RELAY_HOST=${ env.FB_RELAY_HOST }
          --dart-define=FB_CLOUD_RELAY_HOST=${ env.FB_CLOUD_RELAY_HOST }

      - name: Package unsigned iOS IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$PWD/build/ios/iphoneos/Runner.app"
          stage="$RUNNER_TEMP/inutil-ios-ipa"
          ipa="$PWD/dist/InutilMusic-$APP_VERSION-iOS-unsigned.ipa"

          test -d "$app"
          test -f "$app/Info.plist"
          test -x "$app/Runner"
          test -f "$app/PlugIns/NowPlayingWidget.appex/Info.plist"
          test -x "$app/PlugIns/NowPlayingWidget.appex/NowPlayingWidget"
          test ! -e "$app/embedded.mobileprovision"
          test ! -d "$app/_CodeSignature"
          /usr/bin/lipo "$app/Runner" -verify_arch arm64
          /usr/bin/lipo "$app/PlugIns/NowPlayingWidget.appex/NowPlayingWidget" -verify_arch arm64

          built_version="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleShortVersionString' \
              "$app/Info.plist"
          )"
          test "$built_version" = "$APP_VERSION"
          if /usr/bin/codesign --verify --deep --strict "$app" >/dev/null 2>&1; then
            echo "Runner.app was expected to be unsigned, but it has a valid signature." >&2
            exit 1
          fi

          rm -rf "$stage"
          mkdir -p "$stage/Payload" "$PWD/dist"
          /usr/bin/ditto "$app" "$stage/Payload/Runner.app"
          (
            cd "$stage"
            /usr/bin/zip -qry -X "$ipa" Payload
          )

          /usr/bin/unzip -tqq "$ipa"
          entries="$(/usr/bin/unzip -Z1 "$ipa")"
          grep -Fxq "Payload/Runner.app/Info.plist" <<<"$entries"
          grep -Fxq "Payload/Runner.app/Runner" <<<"$entries"
          grep -Fxq "Payload/Runner.app/PlugIns/NowPlayingWidget.appex/Info.plist" <<<"$entries"
          grep -Fxq "Payload/Runner.app/PlugIns/NowPlayingWidget.appex/NowPlayingWidget" <<<"$entries"
          if grep -Eq '^__MACOSX/|^Payload/Runner\.app/_CodeSignature/' <<<"$entries"; then
            echo "The unsigned IPA contains signing data or AppleDouble metadata." >&2
            exit 1
          fi
          if grep -Fxq "Payload/Runner.app/embedded.mobileprovision" <<<"$entries"; then
            echo "The unsigned IPA unexpectedly contains a provisioning profile." >&2
            exit 1
          fi

      - name: Upload unsigned iOS IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: InutilMusic-${{ env.APP_VERSION }}-iOS-unsigned
          path: dist/InutilMusic-${{ env.APP_VERSION }}-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
          archive: false

  metadata:
    name: Read app metadata
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read version from pubspec
        id: version
        shell: bash
        run: |
          set -euo pipefail
          pubspec_version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]#]+)[[:space:]]*(#.*)?$/\1/p' pubspec.yaml)"
          if [[ ! "$pubspec_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(\+[0-9]+)?$ ]]; then
            echo "pubspec.yaml must contain one stable X.Y.Z version with an optional numeric build suffix" >&2
            exit 1
          fi
          app_version="${BASH_REMATCH[1]}"

          if [[ "$GITHUB_EVENT_NAME" == "push" && "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            expected_tag="v$app_version"
            if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "Release tag '$GITHUB_REF_NAME' must exactly match pubspec version '$expected_tag'" >&2
              exit 1
            fi
          fi

          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"

  android:
    name: Android release APKs
    needs: [metadata, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      APP_VERSION: ${{ needs.metadata.outputs.app_version }}
      INUTIL_ANDROID_KEYSTORE_BASE64: ${{ secrets.INUTIL_ANDROID_KEYSTORE_BASE64 }}
      INUTIL_ANDROID_STORE_PASSWORD: ${{ secrets.INUTIL_ANDROID_STORE_PASSWORD }}
      INUTIL_ANDROID_KEY_ALIAS: ${{ secrets.INUTIL_ANDROID_KEY_ALIAS }}
      INUTIL_ANDROID_KEY_PASSWORD: ${{ secrets.INUTIL_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Configure Android release signing
        shell: bash
        run: |
          set -euo pipefail
          required=(
            INUTIL_ANDROID_KEYSTORE_BASE64
            INUTIL_ANDROID_STORE_PASSWORD
            INUTIL_ANDROID_KEY_ALIAS
            INUTIL_ANDROID_KEY_PASSWORD
          )
          for variable in "${required[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Required GitHub secret is missing: $variable" >&2
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/inutil-upload-keystore.jks"
          printf '%s' "$INUTIL_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "INUTIL_ANDROID_STORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Resolve dependencies
        run: |
          flutter clean
          flutter pub get --enforce-lockfile

      - name: Patch pub-cache plugins for AGP 9
        shell: bash
        # Mismo parche que el job `quality`: `flutter build apk` también evalúa
        # `:flutter_inappwebview_android` y AGP 9.1.1 rechaza
        # `getDefaultProguardFile('proguard-android.txt')`. Este job nunca llegó
        # a correr en los runs 44879291272 y 44891202761 porque el gate
        # `quality` reventaba primero y lo dejaba `skipped`, así que el mismo
        # defecto lo iba a tumbar aquí; se parchea antes de construir.
        run: bash tool/patch_pub_cache_proguard.sh

      - name: Build ARMv7, ARMv8, and x86_64 APKs
        run: >-
          flutter build apk
          --release
          --split-per-abi
          --target-platform android-arm,android-arm64,android-x64
          --dart-define=FB_RELAY_HOST=${{ env.FB_RELAY_HOST }}
          --dart-define=FB_CLOUD_RELAY_HOST=${{ env.FB_CLOUD_RELAY_HOST }}

      - name: Verify and name Android APKs
        shell: bash
        run: |
          set -euo pipefail
          output="$PWD/build/app/outputs/flutter-apk"
          arm32="$output/app-armeabi-v7a-release.apk"
          arm64="$output/app-arm64-v8a-release.apk"
          x64="$output/app-x86_64-release.apk"
          test -f "$arm32"
          test -f "$arm64"
          test -f "$x64"

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          test -x "$apksigner"
          test -x "$aapt2"
          "$apksigner" verify --verbose "$arm32"
          "$apksigner" verify --verbose "$arm64"
          "$apksigner" verify --verbose "$x64"

          # Medición repetida del control manual que destapó el problema:
          # `unzip -p <apk> lib/<abi>/libapp.so | grep -a -q <host>`. Sobre el
          # build sin defines devuelve falsío (0 ocurrencias, medido también
          # en `build/linux/x64/release/bundle/lib/libapp.so`); sobre el build
          # con defines, 1 ocurrencia de cada host.
          verify_endpoints() {
            apk="$1"
            abi="$2"
            for host in "$FB_RELAY_HOST" "$FB_CLOUD_RELAY_HOST"; do
              # No se usa `grep -q` dentro de la tubería: corta la entrada,
              # `unzip` muere de SIGPIPE y con `set -o pipefail` (que este
              # step sí lleva) la tubería devuelve 141 AUNQUE el host esté.
              # Medido en local sobre `lib/<abi>/libapp.so` de los tres APK:
              # `grep -a -q` sobre el .so extraído → rc 0; ese mismo
              # `grep -a -q` recibido por tubería → rc 141. `grep -a -c` lee
              # todo el archivo, no corta la tubería y deja el conteo.
              hits="$(unzip -p "$apk" "lib/$abi/libapp.so" |
                grep -a -c "$host" || true)"
              if [ "${hits:-0}" -lt 1 ]; then
                echo "APK $apk no lleva horneado el endpoint $host" >&2
                exit 1
              fi
              echo "$abi: $host presente ($hits coincidencias)"
            done
          }
          verify_endpoints "$arm32" armeabi-v7a
          verify_endpoints "$arm64" arm64-v8a
          verify_endpoints "$x64" x86_64

          verify_abi() {
            apk="$1"
            abi="$2"
            entries="$(unzip -Z1 "$apk")"
            printf '%s\n' "$entries" | grep -Fx "lib/$abi/libflutter.so"
            if printf '%s\n' "$entries" |
              awk -F/ -v expected="$abi" '$1 == "lib" && $2 != expected { print; found=1 } END { exit !found }'
            then
              echo "APK contains native libraries for an unexpected ABI: $apk" >&2
              exit 1
            fi
          }

          verify_no_obsolete_resolver() {
            apk="$1"
            entries="$(unzip -Z1 "$apk")"
            obsolete_native="$(
              printf '%s\n' "$entries" |
                grep -Ei '^lib/[^/]+/(libpython[^/]*\.so|libqjs\.so)$' || true
            )"
            if [[ -n "$obsolete_native" ]]; then
              echo "APK contains an obsolete native resolver runtime: $apk" >&2
              printf '%s\n' "$obsolete_native" >&2
              exit 1
            fi

            obsolete_archive="$(
              printf '%s\n' "$entries" |
                grep -Ei '(^|/)(yt-dlp|yt_dlp|ytdlp)(\.[^/]*)?$' || true
            )"
            if [[ -n "$obsolete_archive" ]]; then
              echo "APK contains an obsolete yt-dlp artifact: $apk" >&2
              printf '%s\n' "$obsolete_archive" >&2
              exit 1
            fi

            resources="$("$aapt2" dump resources "$apk")"
            if grep -Eiq 'raw/(yt_dlp|ytdlp)([^[:alnum:]_]|$)' <<<"$resources"; then
              echo "APK resource table still contains raw yt-dlp: $apk" >&2
              exit 1
            fi
          }
          verify_abi "$arm32" "armeabi-v7a"
          verify_abi "$arm64" "arm64-v8a"
          verify_abi "$x64" "x86_64"
          verify_no_obsolete_resolver "$arm32"
          verify_no_obsolete_resolver "$arm64"
          verify_no_obsolete_resolver "$x64"

          mkdir -p dist
          cp "$arm32" "dist/InutilMusic-$APP_VERSION-Android-armeabi-v7a.apk"
          cp "$arm64" "dist/InutilMusic-$APP_VERSION-Android-arm64-v8a.apk"
          cp "$x64" "dist/InutilMusic-$APP_VERSION-Android-x86_64.apk"

      - name: Enforce Android artifact size budgets
        run: |
          # 1.3.1 baseline: about 50.0/51.3/53.0 MiB with audio sources and
          # file metadata support. Keep tight per-ABI caps, including IPADIC.
          dart run tool/check_artifact_size.dart "dist/InutilMusic-$APP_VERSION-Android-armeabi-v7a.apk" 50.5
          dart run tool/check_artifact_size.dart "dist/InutilMusic-$APP_VERSION-Android-arm64-v8a.apk" 52
          dart run tool/check_artifact_size.dart "dist/InutilMusic-$APP_VERSION-Android-x86_64.apk" 53.5

      - name: Upload Android ARMv7 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: InutilMusic-${{ env.APP_VERSION }}-Android-armeabi-v7a
          path: dist/InutilMusic-${{ env.APP_VERSION }}-Android-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Upload Android ARMv8 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: InutilMusic-${{ env.APP_VERSION }}-Android-arm64-v8a
          path: dist/InutilMusic-${{ env.APP_VERSION }}-Android-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Upload Android x86_64 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: InutilMusic-${{ env.APP_VERSION }}-Android-x86_64
          path: dist/InutilMusic-${{ env.APP_VERSION }}-Android-x86_64.apk
          if-no-files-found: error
          retention-days: 30
          archive: false

  windows:
    name: Windows x64 installer
    needs: [metadata, quality]
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      APP_VERSION: ${{ needs.metadata.outputs.app_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Rust for Windows SMTC
        shell: pwsh
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Install pinned NuGet CLI
        shell: pwsh
        run: ./tool/ensure_nuget.ps1

      - name: Resolve dependencies
        run: |
          flutter clean
          flutter pub get --enforce-lockfile

      - name: Test Windows animated artwork
        run: >-
          flutter test
          test/features/music/presentation/providers/spotify_canvas_provider_test.dart
          test/features/music/presentation/widgets/player_canvas_lookup_test.dart
          test/features/music/presentation/widgets/player_canvas_layout_test.dart
          test/features/music/presentation/widgets/spotify_canvas_video_test.dart
          test/services/spotify_canvas/spotify_canvas_resolver_test.dart
          test/services/animated_artwork/apple_animated_artwork_resolver_test.dart
          test/services/player/fragmented_artwork_mp4_test.dart
          test/services/player/artwork_video_rendering_test.dart
          test/services/player/playback_visual_cache_test.dart

      - name: Build Windows release
        run: >-
          flutter build windows --release
          --dart-define=FB_RELAY_HOST=${ env.FB_RELAY_HOST }
          --dart-define=FB_CLOUD_RELAY_HOST=${ env.FB_CLOUD_RELAY_HOST }

      - name: Verify baked server endpoints in the Windows bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$PWD/build/windows/x64/runner/Release"
          for host in "$FB_RELAY_HOST" "$FB_CLOUD_RELAY_HOST"; do
            hits="$(grep -R -a -c "$host" "$bundle" |
              awk -F: '{ total += $2 } END { print total + 0 }' ||
              true)"
            if [ "${hits:-0}" -lt 1 ]; then
              echo "bundle de Windows no lleva horneado el endpoint $host" >&2
              exit 1
            fi
            echo "bundle de Windows: $host presente ($hits coincidencias)"
          done

      - name: Bundle Visual C++ runtime
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD "build/windows/x64/runner/Release"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path -LiteralPath $vswhere)) { throw "vswhere.exe was not found." }

          $vsInstall = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (!$vsInstall) { throw "A Visual Studio installation with C++ tools was not found." }

          $redistRoot = Join-Path $vsInstall "VC/Redist/MSVC"
          $crtDir = Get-ChildItem `
            -Path (Join-Path $redistRoot "*/x64/Microsoft.VC*.CRT") `
            -Directory |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName "vcruntime140.dll") } |
            Sort-Object {
              (Get-Item (Join-Path $_.FullName "vcruntime140.dll")).VersionInfo.FileVersionRaw
            } -Descending |
            Select-Object -First 1
          if (!$crtDir) { throw "The x64 Visual C++ runtime was not found." }

          Copy-Item -Path (Join-Path $crtDir.FullName "*.dll") -Destination $bundle

      - name: Verify Windows bundle
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD "build/windows/x64/runner/Release"
          $required = @(
            (Join-Path $bundle "inutil_music.exe"),
            (Join-Path $bundle "THIRD_PARTY_NOTICES.md"),
            (Join-Path $bundle "msvcp140.dll"),
            (Join-Path $bundle "vcruntime140.dll"),
            (Join-Path $bundle "vcruntime140_1.dll")
          )
          foreach ($path in $required) {
            if (!(Test-Path -LiteralPath $path)) {
              throw "Required Windows bundle file is missing: $path"
            }
          }

          foreach ($relativePath in @("tools", "scripts")) {
            $path = Join-Path $bundle $relativePath
            if (Test-Path -LiteralPath $path) {
              throw "Unexpected external-runtime directory remains in bundle: $path"
            }
          }

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (!$iscc) { throw "Inno Setup 6 was not found on the runner." }

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          & $iscc "/DMyAppVersion=$env:APP_VERSION" "packaging/windows/InutilMusic.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }

          $installer = Join-Path $PWD "dist/InutilMusic-$env:APP_VERSION-Windows-x64-Setup.exe"
          if (!(Test-Path -LiteralPath $installer)) { throw "The Windows installer was not generated." }

      - name: Enforce Windows installer size budget
        shell: pwsh
        run: >-
          dart run tool/check_artifact_size.dart
          "dist/InutilMusic-$env:APP_VERSION-Windows-x64-Setup.exe" 88

      - name: Smoke-test Windows installer
        shell: pwsh
        run: |
          $installer = Join-Path $PWD "dist/InutilMusic-$env:APP_VERSION-Windows-x64-Setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "inutil-music-smoke-install"
          $install = Start-Process `
            -FilePath $installer `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOICONS", "/DIR=`"$installDir`"") `
            -WindowStyle Hidden `
            -Wait `
            -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer smoke test failed with exit code $($install.ExitCode)." }

          $required = @(
            (Join-Path $installDir "inutil_music.exe"),
            (Join-Path $installDir "THIRD_PARTY_NOTICES.md"),
            (Join-Path $installDir "msvcp140.dll"),
            (Join-Path $installDir "vcruntime140.dll"),
            (Join-Path $installDir "vcruntime140_1.dll")
          )
          foreach ($path in $required) {
            if (!(Test-Path -LiteralPath $path)) {
              throw "Installed file is missing: $path"
            }
          }

          foreach ($relativePath in @("tools", "scripts")) {
            $path = Join-Path $installDir $relativePath
            if (Test-Path -LiteralPath $path) {
              throw "Unexpected external-runtime directory remains installed: $path"
            }
          }

          $uninstaller = Join-Path $installDir "unins000.exe"
          $uninstall = Start-Process `
            -FilePath $uninstaller `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
            -WindowStyle Hidden `
            -Wait `
            -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller smoke test failed with exit code $($uninstall.ExitCode)." }

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: InutilMusic-${{ env.APP_VERSION }}-Windows-x64-Setup
          path: dist/InutilMusic-${{ env.APP_VERSION }}-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 30
          archive: false

  linux:
    name: Linux x64 installers
    needs: [metadata, quality]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ needs.metadata.outputs.app_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux build and packaging dependencies
        shell: bash
        run: |
          set -euo pipefail

          # GitHub-hosted images include unrelated third-party APT feeds. Keep
          # this build on the Ubuntu 22.04 base repositories so an outage or
          # access-policy change in those feeds cannot block Inutil packages.
          apt_sourceparts="$RUNNER_TEMP/inutil-apt-sourceparts"
          mkdir -p "$apt_sourceparts"
          apt_options=(
            -o "Dir::Etc::sourcelist=/etc/apt/sources.list"
            -o "Dir::Etc::sourceparts=$apt_sourceparts"
            -o "APT::Get::List-Cleanup=0"
            -o "Acquire::Retries=5"
          )

          sudo apt-get "${apt_options[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get "${apt_options[@]}" install --yes \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsqlite3-dev \
            libsecret-1-dev \
            libmpv-dev \
            desktop-file-utils \
            cpio \
            file \
            rpm \
            unzip

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Linux release
        run: >-
          flutter build linux --release
          --dart-define=FB_RELAY_HOST=${ env.FB_RELAY_HOST }
          --dart-define=FB_CLOUD_RELAY_HOST=${ env.FB_CLOUD_RELAY_HOST }

      - name: Verify baked server endpoints in the Linux bundle
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$PWD/build/linux/x64/release/bundle/lib/libapp.so"
          test -f "$snapshot"
          # Ruta verificada en local (`find build -name libapp.so` →
          # `build/linux/x64/release/bundle/lib/libapp.so`). Medido sobre ese
          # archivo: 0 ocurrencias en el build anterior a los defines, 1 en el
          # build con ellos, así que el control sí discrimina.
          for host in "$FB_RELAY_HOST" "$FB_CLOUD_RELAY_HOST"; do
            hits="$(grep -a -c "$host" "$snapshot" || true)"
            if [ "${hits:-0}" -lt 1 ]; then
              echo "Linux libapp.so no lleva horneado el endpoint $host" >&2
              exit 1
            fi
            echo "Linux libapp.so: $host presente ($hits coincidencias)"
          done

      - name: Verify Linux bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$PWD/build/linux/x64/release/bundle"
          test -x "$bundle/inutil_music"
          test -x "$bundle/Inútil Music"
          test ! -e "$bundle/tools"
          test ! -e "$bundle/scripts"
          desktop-file-validate packaging/linux/com.inutilmusic.app.desktop

          missing=0
          while IFS= read -r -d '' candidate; do
            if file "$candidate" | grep -q 'ELF'; then
              dependencies="$(ldd "$candidate" 2>&1 || true)"
              if grep -q 'not found' <<<"$dependencies"; then
                printf 'Missing shared library for %s:\n%s\n' "$candidate" "$dependencies" >&2
                missing=1
              fi
            fi
          done < <(find "$bundle" -type f -print0)
          test "$missing" -eq 0

      - name: Build DEB and RPM installers
        shell: bash
        run: |
          chmod 755 packaging/linux/build_packages.sh packaging/linux/inutil-music
          packaging/linux/build_packages.sh \
            "$PWD/build/linux/x64/release/bundle" \
            "$APP_VERSION" \
            "$PWD/dist"

      - name: Verify Linux installer payloads
        shell: bash
        run: |
          set -euo pipefail
          deb="$PWD/dist/InutilMusic-$APP_VERSION-linux-amd64.deb"
          rpm="$PWD/dist/InutilMusic-$APP_VERSION-linux-x86_64.rpm"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT

          test "$(dpkg-deb --field "$deb" Version)" = "$APP_VERSION"
          deb_dependencies="$(dpkg-deb --field "$deb" Depends)"
          grep -Eq '(^|, )libsecret-1-0([, ]|$)' <<<"$deb_dependencies"
          dpkg-deb --extract "$deb" "$stage/deb"

          test "$(rpm -qp --queryformat '%{VERSION}' "$rpm")" = "$APP_VERSION"
          rpm_dependencies="$(rpm -qpR "$rpm")"
          grep -Fxq libsecret <<<"$rpm_dependencies"
          mkdir -p "$stage/rpm"
          (
            cd "$stage/rpm"
            rpm2cpio "$rpm" | cpio --quiet -idmu
          )

          for root in "$stage/deb" "$stage/rpm"; do
            test -x "$root/opt/inutil-music/inutil_music"
            test -x "$root/opt/inutil-music/Inútil Music"
            test -f "$root/opt/inutil-music/THIRD_PARTY_NOTICES.md"
            test -x "$root/usr/bin/inutil-music"
            test -f \
              "$root/usr/share/applications/com.inutilmusic.app.desktop"
            test ! -e "$root/opt/inutil-music/tools"
            test ! -e "$root/opt/inutil-music/scripts"
          done

      - name: Enforce Linux installer size budgets
        run: |
          dart run tool/check_artifact_size.dart "dist/InutilMusic-$APP_VERSION-linux-amd64.deb" 108
          dart run tool/check_artifact_size.dart "dist/InutilMusic-$APP_VERSION-linux-x86_64.rpm" 121

      - name: Upload Debian installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: InutilMusic-${{ env.APP_VERSION }}-Linux-DEB-amd64
          path: dist/InutilMusic-${{ env.APP_VERSION }}-linux-amd64.deb
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Upload RPM installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: InutilMusic-${{ env.APP_VERSION }}-Linux-RPM-x86_64
          path: dist/InutilMusic-${{ env.APP_VERSION }}-linux-x86_64.rpm
          if-no-files-found: error
          retention-days: 30
          archive: false

  macos:
    name: macOS ${{ matrix.arch }} installer
    needs: [metadata, quality]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ needs.metadata.outputs.app_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
            host_arch: arm64
            max_mib: 134
          - runner: macos-26-intel
            arch: x64
            host_arch: x86_64
            max_mib: 140

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          if [[ "$actual" != "${{ matrix.host_arch }}" ]]; then
            echo "Expected ${{ matrix.host_arch }} runner, received $actual" >&2
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build macOS release
        run: >-
          flutter build macos --release
          --dart-define=FB_RELAY_HOST=${ env.FB_RELAY_HOST }
          --dart-define=FB_CLOUD_RELAY_HOST=${ env.FB_CLOUD_RELAY_HOST }

      - name: Verify baked server endpoints in the macOS bundle
        shell: bash
        run: |
          set -euo pipefail
          app="$PWD/build/macos/Build/Products/Release/inutil_music.app"
          test -d "$app"
          for host in "$FB_RELAY_HOST" "$FB_CLOUD_RELAY_HOST"; do
            hits="$(grep -R -a -c "$host" "$app" |
              awk -F: '{ total += $2 } END { print total + 0 }' ||
              true)"
            if [ "${hits:-0}" -lt 1 ]; then
              echo "bundle de macOS no lleva horneado el endpoint $host" >&2
              exit 1
            fi
            echo "bundle de macOS: $host presente ($hits coincidencias)"
          done

      - name: Sign embedded macOS code consistently
        shell: bash
        run: |
          set -euo pipefail
          app="$PWD/build/macos/Build/Products/Release/inutil_music.app"
          bash macos/sign_release_bundle.sh "$app"

      - name: Audit macOS application bundle
        shell: bash
        run: |
          set -euo pipefail
          app="$PWD/build/macos/Build/Products/Release/inutil_music.app"
          bash macos/verify_release_bundle.sh \
            "$app" \
            "${{ matrix.host_arch }}" \
            "$APP_VERSION"
          test ! -e "$app/Contents/Resources/tools"
          test ! -e "$app/Contents/Resources/scripts"

      - name: Smoke test macOS launch
        shell: bash
        run: |
          set -euo pipefail
          app="$PWD/build/macos/Build/Products/Release/inutil_music.app"
          executable="$app/Contents/MacOS/inutil_music"
          log="$RUNNER_TEMP/inutil-macos-smoke.log"

          "$executable" >"$log" 2>&1 &
          app_pid=$!

          for _ in {1..8}; do
            sleep 1
            if ! kill -0 "$app_pid" 2>/dev/null; then
              wait "$app_pid" || true
              cat "$log"
              echo "Inútil Music terminated during the macOS launch smoke test." >&2
              exit 1
            fi
          done

          kill -TERM "$app_pid" 2>/dev/null || true
          wait "$app_pid" || true

      - name: Build macOS PKG installer
        shell: bash
        run: |
          set -euo pipefail
          app="$PWD/build/macos/Build/Products/Release/inutil_music.app"
          executable="$app/Contents/MacOS/inutil_music"
          test -x "$executable"

          lipo "$executable" -verify_arch "${{ matrix.host_arch }}"

          payload="$RUNNER_TEMP/inutil-pkg-root"
          staged_app="$payload/Applications/Inútil Music.app"
          rm -rf "$payload"
          mkdir -p "$payload/Applications"
          ditto "$app" "$staged_app"
          codesign --verify --deep --strict "$staged_app"

          mkdir -p dist
          package="dist/InutilMusic-$APP_VERSION-macOS-${{ matrix.arch }}.pkg"
          pkgbuild \
            --root "$payload" \
            --install-location / \
            --identifier com.inutilmusic.app.pkg \
            --version "$APP_VERSION" \
            --ownership recommended \
            "$package"
          payload_files="$RUNNER_TEMP/inutil-payload-files.txt"
          pkgutil --payload-files "$package" >"$payload_files"
          grep -Fq \
            "Inútil Music.app/Contents/MacOS/inutil_music" \
            "$payload_files"
          if grep -Eiq '/(tools|scripts)(/|$)' "$payload_files"; then
            echo "Unexpected external-runtime directory found in macOS package payload." >&2
            exit 1
          fi

          expanded_package="$RUNNER_TEMP/inutil-expanded-pkg"
          rm -rf "$expanded_package"
          pkgutil --expand-full "$package" "$expanded_package"
          packaged_app="$(
            find "$expanded_package" -type d -name "Inútil Music.app" \
              -print -quit
          )"
          test -n "$packaged_app"
          codesign --verify --deep --strict "$packaged_app"

      - name: Enforce macOS installer size budget
        run: >-
          dart run tool/check_artifact_size.dart
          "dist/InutilMusic-$APP_VERSION-macOS-${{ matrix.arch }}.pkg"
          ${{ matrix.max_mib }}

      - name: Upload macOS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: InutilMusic-${{ env.APP_VERSION }}-macOS-${{ matrix.arch }}
          path: dist/InutilMusic-${{ env.APP_VERSION }}-macOS-${{ matrix.arch }}.pkg
          if-no-files-found: error
          retention-days: 30
          archive: false
