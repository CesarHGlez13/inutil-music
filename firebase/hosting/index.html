<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 440px;
      background: #0d111c;
      border: 1px solid rgba(255, 255, 255, 0.1);

    p { font-size: 14px; color: #94a3b8; margin: 0 0 20px; line-height: 1.5; }
    a {
      display: inline-block;
      background: #38bdf8;
      color: #07090e;
      font-weight: 700;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
    }
  </style>
  <script>
    window.location.replace("https://admin.inutix.com/");
  </script>
</head>
<body>
  <div class="card">
    <h1>Este panel anterior fue desactivado</h1>
    <p>
      El nodo autoritativo ahora vive en <strong>api.inutix.com</strong>.
      Redirigiendo a la consola oficial <strong>admin.inutix.com</strong>…
